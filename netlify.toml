"$schema" = "https://open-api.netlify.com/netlify.schema.json"

# Deliberate publication guard. Owner approval is required before any deployment.
[build]
  publish = "public"
  command = "echo 'Unpublished concept: deployment is intentionally disabled.' >&2; exit 1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
